name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop
      - master
    types: [
      opened,
      synchronize,
      reopened
    ]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/ci-nestjs.yml@develop

  validate_nats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint NATS chart
        run: |
          helm lint ./k8s/nats --values ./k8s/nats/values-dev.yaml
          helm lint ./k8s/nats --values ./k8s/nats/values-prod.yaml
          helm template nats ./k8s/nats --namespace client-gateway --values ./k8s/nats/values-dev.yaml

  publish_deploy_dev:
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    permissions:
      contents: read
      id-token: write
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: dev
      aws_region: ${{ vars.AWS_REGION }}
      ecr_repository: ${{ vars.ECR_REPOSITORY_DEV }}
      eks_cluster: ${{ vars.EKS_CLUSTER_DEV }}
      namespace: client-gateway
      helm_release: client-gateway
      chart_path: ./k8s/client-gateway
      deploy: false
    secrets: inherit

  publish_deploy_prod:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      id-token: write
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: prod
      aws_region: ${{ vars.AWS_REGION }}
      ecr_repository: ${{ vars.ECR_REPOSITORY_PROD }}
      eks_cluster: ${{ vars.EKS_CLUSTER_PROD }}
      namespace: client-gateway
      helm_release: client-gateway
      chart_path: ./k8s/client-gateway
      deploy: false
    secrets: inherit
